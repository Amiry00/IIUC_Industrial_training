name: environemntapp
description: "Air Quality Monitor - Environment Awareness Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.3.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Navigation
  go_router: ^14.8.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  share_plus: ^10.1.4
  flutter_svg: ^2.0.17
  sqflite_common_ffi: ^2.4.2
  crypto: ^3.0.7
  flutter_local_notifications: ^22.0.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  fl_chart: ^1.2.0
  dio_smart_retry: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
