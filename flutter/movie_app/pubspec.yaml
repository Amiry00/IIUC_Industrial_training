name: cinema
description: "Cinema - Your Cinema, Anywhere. A premium movie streaming app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  

  cupertino_icons: ^1.0.8

  # HTTP Client
  dio: ^5.4.0

  # State Management
  provider: ^6.1.1

  # Local Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+2
  path_provider: ^2.1.1
  path: ^1.8.3

  # Image Caching
  cached_network_image: ^3.3.1

  # Responsive UI
  flutter_screenutil: ^5.9.0

  # Dependency Injection
  get_it: ^7.6.4

  # Connectivity
  connectivity_plus: ^6.0.3

  # Google Fonts
  google_fonts: ^6.1.0

  # Shimmer Loading
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  youtube_explode_dart: ^3.1.0
  share_plus: ^13.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
